appId: com.tobbe96.jwire
productName: JWire
copyright: Copyright © 2026 Tobias Boström

directories:
  output: installation

files:
  - electron/**/*
  - "!node_modules"
  - "!e2e"
  - "!docs"
  - "!test-results"

extraResources:
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
  - from: .next/standalone/node_modules
    to: standalone/node_modules
  - from: .next/static
    to: standalone/.next/static
  - from: public
    to: standalone/public

win:
  target:
    - nsis
    - portable
  icon: public/icons/icon-512x512.png
  signAndEditExecutable: false

mac:
  target:
    - dmg
  icon: public/icons/icon-512x512.png
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
    - deb
  icon: public/icons/icon-512x512.png
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
